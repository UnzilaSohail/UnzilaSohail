<svg width="900" height="260" viewBox="0 0 900 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgD" x1="0" y1="0" x2="900" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0b0f1f"/>
      <stop offset="55%" stop-color="#170f2e"/>
      <stop offset="100%" stop-color="#241640"/>
    </linearGradient>
    <linearGradient id="nameD" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="50%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
  </defs>

  <rect width="900" height="260" rx="20" fill="url(#bgD)"/>
  <rect x="1" y="1" width="898" height="258" rx="19" fill="none" stroke="#3b2f5c" stroke-width="1.5"/>

  <!-- multi-agent node network -->
  <g stroke="#a78bfa" stroke-width="1.1" stroke-opacity="0.35">
    <line x1="700" y1="55" x2="790" y2="95"><animate attributeName="stroke-opacity" values="0.15;0.5;0.15" dur="3.2s" repeatCount="indefinite"/></line>
    <line x1="790" y1="95" x2="760" y2="175"><animate attributeName="stroke-opacity" values="0.4;0.1;0.4" dur="2.6s" repeatCount="indefinite"/></line>
    <line x1="760" y1="175" x2="680" y2="150"><animate attributeName="stroke-opacity" values="0.1;0.45;0.1" dur="3.6s" repeatCount="indefinite"/></line>
    <line x1="680" y1="150" x2="700" y2="55"><animate attributeName="stroke-opacity" values="0.35;0.05;0.35" dur="2.9s" repeatCount="indefinite"/></line>
    <line x1="680" y1="150" x2="600" y2="200"><animate attributeName="stroke-opacity" values="0.2;0.5;0.2" dur="4s" repeatCount="indefinite"/></line>
    <line x1="790" y1="95" x2="840" y2="170"><animate attributeName="stroke-opacity" values="0.3;0.05;0.3" dur="3.3s" repeatCount="indefinite"/></line>
  </g>
  <g fill="#f0abfc">
    <circle cx="700" cy="55" r="4"><animate attributeName="r" values="3;5.5;3" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="790" cy="95" r="5"><animate attributeName="r" values="4;6.5;4" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="760" cy="175" r="3.5"><animate attributeName="r" values="3;5;3" dur="2.7s" repeatCount="indefinite"/></circle>
    <circle cx="680" cy="150" r="4.5"><animate attributeName="r" values="3.5;6;3.5" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="600" cy="200" r="3"><animate attributeName="r" values="2.5;4.5;2.5" dur="2.3s" repeatCount="indefinite"/></circle>
    <circle cx="840" cy="170" r="3.5"><animate attributeName="r" values="3;5;3" dur="2.8s" repeatCount="indefinite"/></circle>
  </g>

  <!-- status pulse -->
  <circle cx="65" cy="52" r="6" fill="#34d399">
    <animate attributeName="opacity" values="1;0.35;1" dur="1.6s" repeatCount="indefinite"/>
  </circle>
  <text x="82" y="58" font-family="'Fira Code',Consolas,monospace" font-size="13" fill="#9ca3af" letter-spacing="1">CURRENTLY ORCHESTRATING AGENTS</text>

  <text x="60" y="130" font-family="'Segoe UI',Verdana,sans-serif" font-size="48" font-weight="800" fill="url(#nameD)">Unzila Anjum</text>
  <rect x="428" y="105" width="4" height="42" fill="#e9d5ff">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>

  <text x="62" y="168" font-family="'Fira Code',Consolas,monospace" font-size="21" fill="#c4b5fd">AI Automation &amp; Agentic AI Engineer</text>
  <text x="62" y="200" font-family="'Fira Code',Consolas,monospace" font-size="15" fill="#8b8fa8">&gt; orchestrating.multi_agent_systems()  //  LangGraph · Voice AI · RAG · FastAPI</text>

  <rect x="60" y="222" width="0" height="3" fill="url(#nameD)" rx="1.5">
    <animate attributeName="width" values="0;520;520;0" keyTimes="0;0.4;0.9;1" dur="4s" repeatCount="indefinite"/>
  </rect>
</svg>
