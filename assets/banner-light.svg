<svg width="900" height="260" viewBox="0 0 900 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgL" x1="0" y1="0" x2="900" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#faf7ff"/>
      <stop offset="55%" stop-color="#f3ecff"/>
      <stop offset="100%" stop-color="#ece0ff"/>
    </linearGradient>
    <linearGradient id="nameL" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="50%" stop-color="#db2777"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <rect width="900" height="260" rx="20" fill="url(#bgL)"/>
  <rect x="1" y="1" width="898" height="258" rx="19" fill="none" stroke="#ddd0f7" stroke-width="1.5"/>

  <!-- multi-agent node network -->
  <g stroke="#7c3aed" stroke-width="1.1" stroke-opacity="0.28">
    <line x1="700" y1="55" x2="790" y2="95"><animate attributeName="stroke-opacity" values="0.12;0.4;0.12" dur="3.2s" repeatCount="indefinite"/></line>
    <line x1="790" y1="95" x2="760" y2="175"><animate attributeName="stroke-opacity" values="0.35;0.08;0.35" dur="2.6s" repeatCount="indefinite"/></line>
    <line x1="760" y1="175" x2="680" y2="150"><animate attributeName="stroke-opacity" values="0.08;0.38;0.08" dur="3.6s" repeatCount="indefinite"/></line>
    <line x1="680" y1="150" x2="700" y2="55"><animate attributeName="stroke-opacity" values="0.3;0.05;0.3" dur="2.9s" repeatCount="indefinite"/></line>
    <line x1="680" y1="150" x2="600" y2="200"><animate attributeName="stroke-opacity" values="0.18;0.4;0.18" dur="4s" repeatCount="indefinite"/></line>
    <line x1="790" y1="95" x2="840" y2="170"><animate attributeName="stroke-opacity" values="0.25;0.05;0.25" dur="3.3s" repeatCount="indefinite"/></line>
  </g>
  <g fill="#db2777">
    <circle cx="700" cy="55" r="4"><animate attributeName="r" values="3;5.5;3" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="790" cy="95" r="5"><animate attributeName="r" values="4;6.5;4" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="760" cy="175" r="3.5"><animate attributeName="r" values="3;5;3" dur="2.7s" repeatCount="indefinite"/></circle>
    <circle cx="680" cy="150" r="4.5"><animate attributeName="r" values="3.5;6;3.5" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="600" cy="200" r="3"><animate attributeName="r" values="2.5;4.5;2.5" dur="2.3s" repeatCount="indefinite"/></circle>
    <circle cx="840" cy="170" r="3.5"><animate attributeName="r" values="3;5;3" dur="2.8s" repeatCount="indefinite"/></circle>
  </g>

  <!-- status pulse -->
  <circle cx="65" cy="52" r="6" fill="#059669">
    <animate attributeName="opacity" values="1;0.35;1" dur="1.6s" repeatCount="indefinite"/>
  </circle>
  <text x="82" y="58" font-family="'Fira Code',Consolas,monospace" font-size="13" fill="#6b7280" letter-spacing="1">CURRENTLY ORCHESTRATING AGENTS</text>

  <text x="60" y="130" font-family="'Segoe UI',Verdana,sans-serif" font-size="48" font-weight="800" fill="url(#nameL)">Unzila Anjum</text>
  <rect x="428" y="105" width="4" height="42" fill="#7c3aed">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>

  <text x="62" y="168" font-family="'Fira Code',Consolas,monospace" font-size="21" fill="#6d28d9">AI Automation &amp; Agentic AI Engineer</text>
  <text x="62" y="200" font-family="'Fira Code',Consolas,monospace" font-size="15" fill="#7c7a92">&gt; orchestrating.multi_agent_systems()  //  LangGraph · Voice AI · RAG · FastAPI</text>

  <rect x="60" y="222" width="0" height="3" fill="url(#nameL)" rx="1.5">
    <animate attributeName="width" values="0;520;520;0" keyTimes="0;0.4;0.9;1" dur="4s" repeatCount="indefinite"/>
  </rect>
</svg>
